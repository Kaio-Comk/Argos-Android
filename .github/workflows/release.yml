name: Build Release AAB

on:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: these jobs only read the code.
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > release.keystore

    - name: Build AAB
      run: ./gradlew bundleRelease --no-daemon

    # 04/11/2026: the store password was written here in plain text (public repo) and the keystore itself
    # was uploaded as a workflow artifact. Now the password comes from a secret, reaches jarsigner through
    # an environment variable (not the command line) and the keystore never leaves the runner.
    - name: Sign AAB
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "::error::Create the repository secret KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
          exit 1
        fi
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass:env KEYSTORE_PASSWORD app/build/outputs/bundle/release/app-release.aab twinfinder
        mv app/build/outputs/bundle/release/app-release.aab app-release-signed.aab

    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: TwinFinder-Release-Bundle
        path: app-release-signed.aab

    - name: Remove the decoded keystore
      if: always()
      run: rm -f release.keystore
